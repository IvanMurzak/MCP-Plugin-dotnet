name: deploy

# Reusable child of release.yml ONLY. No release/dispatch trigger of its own: the only path
# to a NuGet publish is a manual dispatch of release.yml, after its full test set passes.
on:
  workflow_call:
    inputs:
      version: { required: true, type: string }

jobs:
  deploy-to-nuget:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from input
        id: version
        run: |
          version=${{ inputs.version }}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        working-directory: ./
        run: dotnet restore

      - name: Build
        working-directory: ./
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: ./
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Login to NuGet with Trusted Publishing
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: IvanMurzak

      - name: Pack McpPlugin.Common NuGet package
        working-directory: ./McpPlugin.Common
        run: dotnet pack McpPlugin.Common.csproj --no-build --configuration Release --output ../nupkg

      - name: Pack McpPlugin NuGet package
        working-directory: ./McpPlugin
        run: dotnet pack McpPlugin.csproj --no-build --configuration Release --output ../nupkg

      - name: Pack McpPlugin.Server NuGet package
        working-directory: ./McpPlugin.Server
        run: dotnet pack McpPlugin.Server.csproj --no-build --configuration Release --output ../nupkg

      # net10.0 is built only on a .NET 10+ SDK (the csproj gate), so a lost 10.0.x setup would
      # silently drop lib/net10.0 instead of failing: check every lib folder before any push.
      - name: Verify package target frameworks
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          fail=0
          check_libs() {
            f="./nupkg/$1.$version.nupkg"; shift
            for tfm in "$@"; do
              if unzip -Z1 "$f" "lib/$tfm/*" >/dev/null 2>&1; then echo "OK  $f lib/$tfm"; else echo "::error::$f has no lib/$tfm"; fail=1; fi
            done
          }
          check_libs com.IvanMurzak.McpPlugin.Common netstandard2.1
          check_libs com.IvanMurzak.McpPlugin netstandard2.1 net8.0 net9.0 net10.0
          check_libs com.IvanMurzak.McpPlugin.Server net8.0 net9.0 net10.0
          exit $fail

      - name: Deploy McpPlugin.Common NuGet package
        run: |
          nupkg_file="./nupkg/com.IvanMurzak.McpPlugin.Common.${{ steps.version.outputs.version }}.nupkg"
          if [ ! -f "$nupkg_file" ]; then
            echo "Error: Expected .nupkg file not found: $nupkg_file"
            exit 1
          fi
          echo "Deploying NuGet package: $nupkg_file (version: ${{ steps.version.outputs.version }})"
          dotnet nuget push "$nupkg_file" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Deploy McpPlugin NuGet package
        run: |
          nupkg_file="./nupkg/com.IvanMurzak.McpPlugin.${{ steps.version.outputs.version }}.nupkg"
          if [ ! -f "$nupkg_file" ]; then
            echo "Error: Expected .nupkg file not found: $nupkg_file"
            exit 1
          fi
          echo "Deploying NuGet package: $nupkg_file (version: ${{ steps.version.outputs.version }})"
          dotnet nuget push "$nupkg_file" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Deploy McpPlugin.Server NuGet package
        run: |
          nupkg_file="./nupkg/com.IvanMurzak.McpPlugin.Server.${{ steps.version.outputs.version }}.nupkg"
          if [ ! -f "$nupkg_file" ]; then
            echo "Error: Expected .nupkg file not found: $nupkg_file"
            exit 1
          fi
          echo "Deploying NuGet package: $nupkg_file (version: ${{ steps.version.outputs.version }})"
          dotnet nuget push "$nupkg_file" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate