name: test-pull-request

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  test:
    # Cross-platform matrix (design 04 §5): the machine credential store's at-rest protection and
    # atomic-write behaviour are OS-specific — DPAPI + rename/handle timing on Windows, 0600/0700
    # permission asserts on the POSIX legs — so the suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        working-directory: ./
        run: dotnet restore

      - name: Build
        working-directory: ./
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: ./
        # LogFilePrefix (not LogFileName): the solution has 2 test projects x 2 TFMs = 4 test runs;
        # a fixed LogFileName makes each run overwrite the previous .trx ("WARNING: Overwriting
        # results file") so only the last leg's results survived to upload/publish. The prefix form
        # yields one uniquely-named .trx per run, all still matching TestResults/**/*.trx below.
        run: dotnet test --no-build --verbosity normal --configuration Release --logger "trx;LogFilePrefix=test-results" --results-directory ./TestResults

      - name: Publish Test Results
        # The docker-based action only runs on Linux; the Windows/macOS legs upload their .trx
        # artifacts below and gate on the test step itself.
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          files: 'TestResults/**/*.trx'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx

  # mcp-authorize Phase-2 gate (design 04/07, task b8): the cross-language golden-vector parity
  # signal. The C# ProjectIdentity vectors (McpPlugin/src/AgentConfig/ProjectIdentity.GoldenVectors.json)
  # are the canonical origin every TS/JS engine-CLI port MUST reproduce at Phase 4 (routing pin +
  # deterministic local port). Kept a DISTINCT job so the contract has its own visible CI status the
  # TS consumers plug into later; runs the reference tests hermetically (no external services).
  golden-vector-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore McpPlugin.Tests/McpPlugin.Tests.csproj

      - name: Build
        run: dotnet build McpPlugin.Tests/McpPlugin.Tests.csproj --no-restore --configuration Release

      - name: Golden-vector parity (C# ProjectIdentity reference)
        run: >-
          dotnet test McpPlugin.Tests/McpPlugin.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~ProjectIdentityGoldenVector"
          -- RunConfiguration.TreatNoTestsAsError=true
