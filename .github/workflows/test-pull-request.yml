name: test-pull-request

# Chain leg (node `mcp-plugin-dotnet`): the SAME jobs also run under `workflow_dispatch` with a
# chain lock as their single input. `.github/scripts/chain_feed.py` (vendored, byte-identical to
# ai-game-dev-software `.scripts/chain/leg/chain_feed.py`) then self-builds ReflectorNet from the
# lock's sha into a local feed and forces it with an exact `[ws]` override before restore. On an
# ordinary pull_request every chain step is a no-op ("chain: no lock (ordinary run)").
on:
  pull_request:
    branches: [main, dev, chain-testing]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      lock:
        description: the chain lock JSON (<= 60000 characters)
        required: true
        type: string
      lock_hash8:
        description: first 8 hex characters of the lock hash
        required: true
        type: string

# Empty on ordinary runs => GitHub's default title. The chain dispatcher captures a dispatched run
# by this exact title + headSha. No `concurrency` block: nothing cancels today, and two different
# locks must be able to run side by side.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('chain {0} mcp-plugin-dotnet', inputs.lock_hash8) || '' }}

env:
  CHAIN_LOCK: ${{ inputs.lock }}
  CHAIN_LOCK_HASH8: ${{ inputs.lock_hash8 }}

jobs:
  test:
    # Cross-platform matrix (design 04 §5): the machine credential store's at-rest protection and
    # atomic-write behaviour are OS-specific — DPAPI + rename/handle timing on Windows, 0600/0700
    # permission asserts on the POSIX legs — so the suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: chain feed
        id: chain
        shell: bash
        run: |
          PY="$(command -v python || command -v python3)"
          "$PY" .github/scripts/chain_feed.py apply --node mcp-plugin-dotnet --job test

      - name: Restore dependencies
        working-directory: ./
        run: dotnet restore

      - name: Build
        working-directory: ./
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: ./
        # LogFilePrefix (not LogFileName): the solution has 2 test projects x 2 TFMs = 4 test runs;
        # a fixed LogFileName makes each run overwrite the previous .trx ("WARNING: Overwriting
        # results file") so only the last leg's results survived to upload/publish. The prefix form
        # yields one uniquely-named .trx per run, all still matching TestResults/**/*.trx below.
        run: dotnet test --no-build --verbosity normal --configuration Release --logger "trx;LogFilePrefix=test-results" --results-directory ./TestResults

      - name: Publish Test Results
        # The docker-based action only runs on Linux; the Windows/macOS legs upload their .trx
        # artifacts below and gate on the test step itself.
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && runner.os == 'Linux'
        with:
          files: 'TestResults/**/*.trx'

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx

      # Identity proof (never an exit code): every consumer's obj/project.assets.json must resolve
      # the lock's ws ReflectorNet. Exits 3 on any mismatch => this job is RED even if tests passed.
      - name: chain leg record
        id: chain_record
        if: always()
        shell: bash
        run: |
          PY="$(command -v python || command -v python3)"
          "$PY" .github/scripts/chain_feed.py record --node mcp-plugin-dotnet --job test --job-status "${{ job.status }}" --out chain-leg.json

      - name: chain leg artifact
        if: always() && env.CHAIN_ACTIVE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json

  # mcp-authorize Phase-2 gate (design 04/07, task b8): the cross-language golden-vector parity
  # signal. The C# ProjectIdentity vectors (McpPlugin/src/AgentConfig/ProjectIdentity.GoldenVectors.json)
  # are the canonical origin every TS/JS engine-CLI port MUST reproduce at Phase 4 (routing pin +
  # deterministic local port). Kept a DISTINCT job so the contract has its own visible CI status the
  # TS consumers plug into later; runs the reference tests hermetically (no external services).
  golden-vector-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: chain feed
        id: chain
        shell: bash
        run: |
          PY="$(command -v python || command -v python3)"
          "$PY" .github/scripts/chain_feed.py apply --node mcp-plugin-dotnet --job golden-vector-parity

      - name: Restore
        run: dotnet restore McpPlugin.Tests/McpPlugin.Tests.csproj

      - name: Build
        run: dotnet build McpPlugin.Tests/McpPlugin.Tests.csproj --no-restore --configuration Release

      - name: Golden-vector parity (C# ProjectIdentity reference)
        run: >-
          dotnet test McpPlugin.Tests/McpPlugin.Tests.csproj
          --no-build --configuration Release --verbosity normal
          --filter "FullyQualifiedName~ProjectIdentityGoldenVector"
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: chain leg record
        id: chain_record
        if: always()
        shell: bash
        run: |
          PY="$(command -v python || command -v python3)"
          "$PY" .github/scripts/chain_feed.py record --node mcp-plugin-dotnet --job golden-vector-parity --job-status "${{ job.status }}" --out chain-leg.json

      - name: chain leg artifact
        if: always() && env.CHAIN_ACTIVE == '1'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.chain_record.outputs.artifact_name }}
          path: chain-leg.json
