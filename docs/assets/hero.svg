<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="MCP Plugin for .NET: a running .NET app connects to McpPlugin.Server over SignalR, and AI agents reach it over MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <path id="up1" d="M930 240 L930 200"/>
    <path id="up2" d="M930 140 L930 100"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .link { stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { transform-origin: 930px 170px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="930" cy="170" r="230" fill="url(#glow)"/>
    <circle cx="160" cy="300" r="220" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <rect x="64" y="44" width="352" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
      <circle cx="84" cy="61" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="98" y="67" font-size="16" fill="#e2e8f0" letter-spacing=".4">MODEL CONTEXT PROTOCOL · .NET</text>
      <text x="62" y="140" font-size="56" font-weight="700" fill="url(#title)" letter-spacing="-1">MCP Plugin for .NET</text>
      <text x="64" y="182" font-size="24" fill="#e2e8f0">Expose tools, prompts and resources of a</text>
      <text x="64" y="214" font-size="24" fill="#e2e8f0">running .NET app to AI agents over MCP.</text>
      <rect x="64" y="244" width="560" height="50" rx="10" fill="#020617" fill-opacity="0.75" stroke="#475569"/>
      <text class="mono" x="84" y="276" font-size="18" fill="#94a3b8">$ <tspan fill="#f1f5f9">dotnet add package </tspan><tspan fill="#67e8f9">com.IvanMurzak.McpPlugin</tspan></text>
      <rect class="caret" x="598" y="260" width="9" height="20" fill="#67e8f9"/>
    </g>

    <!-- right: agent <- server <- app -->
    <g fill="none" stroke-width="2">
      <use href="#up1" class="link" stroke="#67e8f9" stroke-opacity=".9"/>
      <use href="#up2" class="link" stroke="#e879f9" stroke-opacity=".9"/>
    </g>
    <g>
      <circle r="4.5" fill="#67e8f9"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#up1"/></animateMotion></circle>
      <circle r="4.5" fill="#a5b4fc"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#up1"/></animateMotion></circle>
      <circle r="4.5" fill="#e879f9"><animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite"><mpath href="#up2"/></animateMotion></circle>
      <circle r="4.5" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#up2"/></animateMotion></circle>
    </g>

    <g class="sans">
      <rect x="800" y="36" width="260" height="64" rx="14" fill="#0f172a" stroke="#e879f9" stroke-opacity=".8"/>
      <text x="930" y="64" text-anchor="middle" font-size="20" font-weight="600" fill="#f1f5f9">AI agent</text>
      <text x="930" y="87" text-anchor="middle" font-size="16" fill="#a5b4cb">any MCP client</text>
      <g class="pulse">
        <rect x="780" y="140" width="300" height="60" rx="14" fill="#0d1428" stroke="url(#edge)" stroke-width="2.5"/>
        <text class="mono" x="930" y="167" text-anchor="middle" font-size="19" font-weight="700" fill="#f1f5f9">McpPlugin.Server</text>
        <text x="930" y="189" text-anchor="middle" font-size="16" fill="#a5b4cb">the bridge (ASP.NET Core)</text>
      </g>
      <rect x="800" y="240" width="260" height="64" rx="14" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".8"/>
      <text x="930" y="268" text-anchor="middle" font-size="20" font-weight="600" fill="#f1f5f9">Your .NET app</text>
      <text class="mono" x="930" y="291" text-anchor="middle" font-size="16" fill="#67e8f9">+ McpPlugin</text>

      <text x="946" y="126" font-size="16" fill="#f0abfc">MCP · stdio or HTTP</text>
      <text x="946" y="226" font-size="16" fill="#a5f3fc">SignalR</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
