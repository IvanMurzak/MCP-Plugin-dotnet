<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="MCP Plugin for .NET: a running .NET app connects to McpPlugin.Server over SignalR, and AI agents reach it over MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="20"/></clipPath>
    <path id="up1" d="M930 238 L930 196"/>
    <path id="up2" d="M930 144 L930 102"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .link { stroke-dasharray: 4 6; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .fade { animation: in .9s ease-out both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes in { from { opacity: .2; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { transform-origin: 930px 170px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="930" cy="170" r="230" fill="url(#glow)"/>
    <circle cx="160" cy="300" r="220" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <g class="fade d1">
        <rect x="64" y="58" width="300" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <circle cx="82" cy="72" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="94" y="77" font-size="13" fill="#cbd5e1" letter-spacing=".4">MODEL CONTEXT PROTOCOL · .NET</text>
      </g>
      <text class="fade d2" x="62" y="146" font-size="54" font-weight="700" fill="url(#title)" letter-spacing="-1">MCP Plugin for .NET</text>
      <text class="fade d3" x="64" y="186" font-size="21" fill="#cbd5e1">Expose tools, prompts and resources of a running</text>
      <text class="fade d3" x="64" y="214" font-size="21" fill="#cbd5e1">.NET app to AI agents, without being spawned by them.</text>
      <g class="fade d4">
        <rect x="64" y="246" width="500" height="44" rx="10" fill="#020617" fill-opacity="0.7" stroke="#334155"/>
        <text class="mono" x="84" y="274" font-size="16" fill="#94a3b8">$ <tspan fill="#e2e8f0">dotnet add package </tspan><tspan fill="#67e8f9">com.IvanMurzak.McpPlugin</tspan></text>
        <rect class="caret" x="540" y="259" width="8" height="18" fill="#67e8f9"/>
      </g>
    </g>

    <!-- right: app -> server -> agent -->
    <g fill="none" stroke-width="1.8">
      <use href="#up1" class="link" stroke="#67e8f9" stroke-opacity=".8"/>
      <use href="#up2" class="link" stroke="#e879f9" stroke-opacity=".8"/>
    </g>
    <g>
      <circle r="4" fill="#67e8f9"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#up1"/></animateMotion></circle>
      <circle r="4" fill="#a5b4fc"><animateMotion dur="1.6s" begin=".8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#up1"/></animateMotion></circle>
      <circle r="4" fill="#e879f9"><animateMotion dur="1.6s" begin=".4s" repeatCount="indefinite"><mpath href="#up2"/></animateMotion></circle>
      <circle r="4" fill="#c4b5fd"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#up2"/></animateMotion></circle>
    </g>

    <g class="sans">
      <!-- AI agent -->
      <rect x="810" y="50" width="240" height="52" rx="14" fill="#0f172a" stroke="#e879f9" stroke-opacity=".7"/>
      <text x="930" y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0">AI agent</text>
      <text x="930" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">any MCP client</text>
      <!-- server -->
      <g class="pulse">
        <rect x="790" y="144" width="280" height="52" rx="14" fill="#0d1428" stroke="url(#edge)" stroke-width="2"/>
        <text class="mono" x="930" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#e2e8f0">McpPlugin.Server</text>
        <text x="930" y="186" text-anchor="middle" font-size="12" fill="#94a3b8">the bridge, ASP.NET Core</text>
      </g>
      <!-- app -->
      <rect x="810" y="238" width="240" height="52" rx="14" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".7"/>
      <text x="930" y="262" text-anchor="middle" font-size="16" font-weight="600" fill="#e2e8f0">Your .NET app</text>
      <text class="mono" x="930" y="280" text-anchor="middle" font-size="12" fill="#67e8f9">+ McpPlugin</text>

      <!-- link labels -->
      <text x="944" y="124" font-size="12" fill="#f0abfc">MCP: stdio or HTTP</text>
      <text x="944" y="221" font-size="12" fill="#a5f3fc">SignalR</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
