<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="MCP Plugin for .NET: a running .NET app connects to McpPlugin.Server over SignalR, and AI agents reach it over MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/><rect width="1200" height="380" fill="url(#hzR)"/><rect width="1200" height="380" fill="url(#hzB)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <text x="64" y="104" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">MODEL CONTEXT PROTOCOL</text><text x="64" y="176" class="s" font-size="56" font-weight="800" letter-spacing="-2" fill="#FAFFFD">MCP Plugin for <tspan fill="#FF5A73">.NET</tspan></text><text x="64" y="226" class="s" font-size="22" fill="#A8C2D2">Expose tools, prompts and resources of a</text><text x="64" y="258" class="s" font-size="22" fill="#A8C2D2">running .NET app to AI agents.</text><g transform="translate(64 304)"><rect width="169" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="84.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">netstandard2.1</text></g><g transform="translate(243 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">net8.0</text></g><g transform="translate(344 304)"><rect width="91" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="45.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">net9.0</text></g><g transform="translate(445 304)"><rect width="101" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="50.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">SignalR</text></g><rect x="800" y="40" width="340" height="70" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="800" y="52" width="3" height="46" rx="1.5" fill="#FF5A73"/><text x="822" y="71.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><text x="822" y="97.0" class="s" font-size="16" fill="#8AA6B8">any MCP client</text><rect x="800" y="155" width="340" height="70" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="800" y="167" width="3" height="46" rx="1.5" fill="#6FA8D0"/><text x="822" y="186.0" class="m" font-size="19" font-weight="700" fill="#FAFFFD">McpPlugin.Server</text><text x="822" y="212.0" class="s" font-size="16" fill="#8AA6B8">the bridge (ASP.NET Core)</text><rect x="800" y="270" width="340" height="70" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="800" y="282" width="3" height="46" rx="1.5" fill="#22C55E"/><text x="822" y="301.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Your .NET app</text><text x="822" y="327.0" class="s" font-size="16" fill="#8AA6B8">+ McpPlugin</text><path id="w1" d="M970 155 L970 110" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="1.6s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M970 270 L970 225" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><text x="988" y="139" text-anchor="start" class="s" font-size="16" fill="#8AA6B8">MCP: stdio or HTTP</text><text x="988" y="254" text-anchor="start" class="s" font-size="16" fill="#8AA6B8">SignalR</text>
    <rect x="0" y="378" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
